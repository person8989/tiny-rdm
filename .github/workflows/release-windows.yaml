name: Release Windows App

run-name: ${{ github.event.release.tag_name || github.event.inputs.tag }}

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag'
        required: true
        default: '1.0.0'


jobs:
  release:
    name: Release Windows App
    runs-on: windows-latest

    strategy:
      matrix:
        platform:
          - windows/amd64
          - windows/arm64


    steps:
      - name: Checkout source code
        uses: actions/checkout@v4


      # windows/amd64 -> windows_x64
      # windows/arm64 -> windows_arm64
      - name: Normalise platform tag
        id: normalise_platform
        shell: bash
        run: |
          tag=$(echo "${{ matrix.platform }}" \
            | sed \
            -e 's/\//_/g' \
            -e 's/amd64/x64/g')

          echo "tag=$tag" >> "$GITHUB_OUTPUT"


      # amd64 -> x64
      # arm64 -> arm64
      - name: Normalise platform name
        id: normalise_platform_name
        shell: bash
        run: |
          pname=$(echo "${{ matrix.platform }}" \
            | sed 's/windows\///g' \
            | sed 's/amd64/x64/g')

          echo "pname=$pname" >> "$GITHUB_OUTPUT"


      - name: Normalise version tag
        id: normalise_version
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            version=$(echo "${{ github.event.release.tag_name }}" | sed 's/v//g')
          else
            version=$(echo "${{ github.event.inputs.tag }}" | sed 's/v//g')
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"


      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable


      - name: Install chocolatey
        uses: crazy-max/ghaction-chocolatey@v2
        with:
          args: install nsis jq


      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Build frontend assets
        shell: bash
        run: |
          npm install -g npm@9


          jq \
          '.info.productVersion = "${{ steps.normalise_version.outputs.version }}"' \
          wails.json > tmp.json

          mv tmp.json wails.json


          cd frontend


          jq \
          '.version = "${{ steps.normalise_version.outputs.version }}"' \
          package.json > tmp.json

          mv tmp.json package.json


          npm install



      - name: Setup Go architecture
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows/amd64" ]; then
            echo "GOARCH=amd64" >> $GITHUB_ENV
          fi

          if [ "${{ matrix.platform }}" = "windows/arm64" ]; then
            echo "GOARCH=arm64" >> $GITHUB_ENV
          fi



      # Portable EXE
      - name: Build Windows portable app
        shell: bash
        run: |
          CGO_ENABLED=1 \
          GOARCH=${GOARCH} \
          wails build \
            -clean \
            -platform ${{ matrix.platform }} \
            -webview2 embed \
            -ldflags "-X main.version=v${{ steps.normalise_version.outputs.version }}"



      - name: Compress portable binary
        working-directory: ./build/bin
        shell: pwsh
        run: |
          Compress-Archive `
            "Tiny RDM.exe" `
            "TinyRDM_Portable_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.zip"



      - name: Upload release asset (Portable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.normalise_version.outputs.version }}

          files: |
            ./build/bin/TinyRDM_Portable_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.zip

          token: ${{ secrets.GITHUB_TOKEN }}



      # NSIS Installer
      - name: Build Windows NSIS installer
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"

          which makensis || (
            echo "makensis not found"
            exit 1
          )


          CGO_ENABLED=1 \
          GOARCH=${GOARCH} \
          wails build \
            -clean \
            -platform ${{ matrix.platform }} \
            -nsis \
            -webview2 embed \
            -ldflags "-X main.version=v${{ steps.normalise_version.outputs.version }}"



      - name: Rename installer
        working-directory: ./build/bin
        shell: pwsh
        run: |
          Rename-Item `
            -Path "tinyrdm-${{ steps.normalise_platform_name.outputs.pname }}-installer.exe" `
            -NewName `
            "TinyRDM_Setup_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform_name.outputs.pname }}.exe"



      - name: Upload release asset (Installer)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.normalise_version.outputs.version }}

          files: |
            ./build/bin/TinyRDM_Setup_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform_name.outputs.pname }}.exe

          token: ${{ secrets.GITHUB_TOKEN }}
